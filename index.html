<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#224c3d" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('etikk-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="description" content="Øv på etikk og samfunnsansvar med flashcards, quiz og dilemmaer fra begrepsguiden din." />
    <link rel="icon" type="image/svg+xml" href="/assets/study-mark.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/learning.css" />
    <link rel="stylesheet" href="/src/exam.css" />
    <title>Etikk — ditt lille øvingsrom</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
